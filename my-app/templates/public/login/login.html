<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · GIM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5"><div class="row justify-content-center"><div class="col-sm-10 col-md-7 col-lg-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h3">GIM</h1><p class="text-secondary">Accede al panel del gimnasio</p>
    {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
      <div class="alert alert-{{ categoria }}" role="alert">{{ mensaje }}</div>
    {% endfor %}
    <form method="post" action="{{ url_for('login.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label for="email" class="form-label">Correo electrónico</label>
        <input id="email" name="email" type="email" class="form-control" maxlength="120" autocomplete="username" required value="{{ request.form.get('email', '') }}"></div>
      <div class="mb-3"><label for="password" class="form-label">Contraseña</label>
        <input id="password" name="password" type="password" class="form-control" maxlength="1024" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
    </form>
  </div></div>
  <footer class="small text-secondary text-center mt-3">Cuentas de prueba: admin@gym.com · recep@gym.com · entre@gym.com<br>Contraseña: <code>Admin123!</code></footer>
</div></div></main>
</body></html>
