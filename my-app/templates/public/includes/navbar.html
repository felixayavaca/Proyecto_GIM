<nav class="navbar navbar-dark bg-dark px-3" aria-label="Barra superior">
  <span class="navbar-brand">GIM · Panel</span>
  {% if session.get('usuario') %}
  <div class="d-flex align-items-center gap-3 text-white flex-wrap">
    <span>{{ session['usuario']['nombre'] }} <small class="text-white-50">{{ session['usuario']['rol_nombre'] }}</small></span>
    <form method="post" action="{{ url_for('login.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
    </form>
  </div>
  {% endif %}
</nav>
